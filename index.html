<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f0e4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-title" content="かな道場">
<meta name="mobile-web-app-capable" content="yes">
<title>かな道場 — 하루 5분 일본어 문자 학습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#26231e;
  --ink-soft:#5c564a;
  --paper:#f6f0e4;
  --paper-2:#efe6d1;
  --card:#fffaf0;
  --shu:#cf3524;
  --shu-d:#a8261a;
  --ai:#33507d;
  --ai-d:#27405f;
  --kin:#b9862e;
  --line:#ddd0b6;
  --ok:#3d7a4f;
  --shadow:0 2px 0 rgba(38,35,30,.08), 0 10px 24px -12px rgba(38,35,30,.25);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Gowun Dodum',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(207,53,36,.06), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(51,80,125,.07), transparent 60%),
    var(--paper);
  min-height:100dvh;
  overscroll-behavior-y:none;
}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px);}
@media(min-width:700px){ #app{max-width:540px} }

/* ---------- signature vertical strip ---------- */
.vstrip{
  display:none;
  position:fixed;top:0;bottom:0;
  writing-mode:vertical-rl;
  font-family:'Klee One',serif;
  font-size:clamp(28px,4vw,40px);
  letter-spacing:.35em;
  color:rgba(38,35,30,.14);
  user-select:none;pointer-events:none;
  padding:4vh 0;
}
.vstrip.left{left:max(12px, calc(50% - 470px))}
.vstrip.right{right:max(12px, calc(50% - 470px));color:rgba(207,53,36,.16)}
@media(min-width:1020px){.vstrip{display:block}}

/* ---------- screens ---------- */
.screen{display:none;animation:fadeUp .35s ease both}
.screen.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- header ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px 12px;
}
.brand{display:flex;align-items:center;gap:12px}
.hanko{
  width:46px;height:46px;border-radius:12px;
  background:var(--shu);color:#fdf7ec;
  display:grid;place-items:center;
  font-family:'Klee One',serif;font-weight:600;font-size:26px;
  box-shadow:var(--shadow);
  transform:rotate(-4deg);
}
.brand h1{font-family:'Gowun Batang',serif;font-size:21px;font-weight:700;letter-spacing:-.5px}
.brand small{display:block;font-family:'Gowun Dodum';font-weight:400;font-size:11.5px;color:var(--ink-soft);letter-spacing:0}
.stats{display:flex;gap:8px}
.stat-chip{
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:6px 12px;font-size:13px;display:flex;align-items:center;gap:6px;
  box-shadow:0 1px 0 rgba(38,35,30,.05);
}
.stat-chip b{font-family:'Gowun Batang';color:var(--shu)}
.stat-chip .flame{color:var(--shu)}
.stat-chip .xp{color:var(--kin)}

/* ---------- mission card ---------- */
.mission{
  margin:8px 20px 0;
  background:linear-gradient(135deg,#2e2a24,#40382e);
  color:#f3ead9;border-radius:20px;padding:22px 22px 20px;
  position:relative;overflow:hidden;
  box-shadow:var(--shadow);
}
.mission::after{
  content:'あ';position:absolute;right:-14px;bottom:-38px;
  font-family:'Klee One';font-size:150px;color:rgba(243,234,217,.08);
  transform:rotate(8deg);
}
.mission .eyebrow{font-size:11.5px;letter-spacing:.18em;color:#cdbf9f;text-transform:uppercase}
.mission h2{font-family:'Gowun Batang';font-size:22px;margin:8px 0 4px}
.mission p{font-size:13.5px;color:#d8cdb4;line-height:1.55;max-width:75%}
.mission .go{
  margin-top:16px;display:inline-flex;align-items:center;gap:8px;
  background:var(--shu);color:#fff;border:none;border-radius:12px;
  font-family:'Gowun Batang';font-size:16px;font-weight:700;
  padding:12px 20px;cursor:pointer;
  box-shadow:0 4px 0 var(--shu-d);
  transition:transform .08s;
}
.mission .go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shu-d)}

/* ---------- progress ---------- */
.prog-wrap{margin:22px 20px 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prog-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.prog-card .pc-top{display:flex;justify-content:space-between;align-items:baseline}
.prog-card .pc-title{font-family:'Klee One';font-size:17px}
.prog-card .pc-title.kata{color:var(--ai)}
.prog-card .pc-title.hira{color:var(--shu)}
.prog-card .pc-num{font-size:12px;color:var(--ink-soft)}
.bar{height:8px;border-radius:99px;background:var(--paper-2);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
.bar.hira i{background:var(--shu)}
.bar.kata i{background:var(--ai)}

/* ---------- section titles ---------- */
.sec-title{
  margin:26px 20px 10px;display:flex;align-items:center;gap:10px;
  font-family:'Gowun Batang';font-size:16px;font-weight:700;
}
.sec-title::after{content:'';flex:1;height:1px;background:var(--line)}
.sec-title .min{font-family:'Gowun Dodum';font-weight:400;font-size:11.5px;color:var(--ink-soft)}

/* ---------- lesson list ---------- */
.lessons{margin:0 20px;display:flex;flex-direction:column;gap:10px}
.lesson{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px 16px;display:flex;align-items:center;gap:14px;
  cursor:pointer;transition:transform .1s, box-shadow .1s;
  position:relative;
}
.lesson:active{transform:scale(.985)}
.lesson.locked{opacity:.45;cursor:not-allowed}
.lesson .kana-row{font-family:'Klee One';font-size:19px;letter-spacing:2px;min-width:118px}
.lesson .kana-row.kata{color:var(--ai)}
.lesson .kana-row.hira{color:var(--ink)}
.lesson .meta{flex:1;min-width:0}
.lesson .meta .t{font-family:'Gowun Batang';font-weight:700;font-size:14.5px}
.lesson .meta .s{font-size:12px;color:var(--ink-soft);margin-top:2px}
.lesson .stamp{
  width:38px;height:38px;border-radius:10px;flex:none;
  display:grid;place-items:center;
  font-family:'Klee One';font-size:20px;font-weight:600;
  border:2px solid transparent;
}
.lesson.done .stamp{
  color:var(--shu);border-color:var(--shu);transform:rotate(-10deg);
  background:rgba(207,53,36,.07);
}
.lesson:not(.done) .stamp{color:#b8ad94;border:2px dashed #cfc2a4;font-size:15px}
.lesson.locked .stamp{border-style:solid}

/* ---------- tab switch (hira/kata) ---------- */
.tabs{display:flex;gap:8px;margin:22px 20px 0}
.tab{
  flex:1;text-align:center;padding:11px 0;border-radius:12px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);
  font-family:'Gowun Batang';font-weight:700;font-size:15px;color:var(--ink-soft);
}
.tab.active.hira{background:var(--shu);border-color:var(--shu);color:#fff}
.tab.active.kata{background:var(--ai);border-color:var(--ai);color:#fff}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;border-radius:14px;cursor:pointer;
  font-family:'Gowun Batang';font-weight:700;font-size:16.5px;
  padding:15px 22px;transition:transform .08s;
  width:100%;
}
.btn.primary{background:var(--shu);color:#fff;box-shadow:0 4px 0 var(--shu-d)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shu-d)}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.ghost:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.indigo{background:var(--ai);color:#fff;box-shadow:0 4px 0 var(--ai-d)}
.btn.indigo:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ai-d)}

/* ---------- lesson header (sub screens) ---------- */
.sub-top{
  display:flex;align-items:center;gap:12px;padding:16px 20px 6px;
}
.back{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none;
}
.back svg{width:18px;height:18px;stroke:var(--ink)}
.sub-top .st-meta{flex:1;min-width:0}
.sub-top .st-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--ink-soft)}
.sub-top .st-title{font-family:'Gowun Batang';font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step-dots{display:flex;gap:5px;flex:none}
.step-dots i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:.2s}
.step-dots i.on{background:var(--shu);width:20px}

/* ---------- learn cards ---------- */
.learn-stage{padding:14px 20px 0;display:flex;flex-direction:column;min-height:calc(100dvh - 96px)}
.card3d{flex:1;display:flex;flex-direction:column}
/* iOS-safe card: no 3D transforms — faces cross-fade */
.kcard{
  flex:1;min-height:380px;border-radius:24px;cursor:pointer;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;flex-direction:column;
}
.kface{
  flex:1;width:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 22px;text-align:center;
}
.kface.back{display:none}
.kcard.flipped .kface.front{display:none}
.kcard.flipped .kface.back{display:flex;animation:faceIn .3s ease both}
@keyframes faceIn{from{opacity:.2;transform:scale(.97)}to{opacity:1;transform:none}}
.kface.front .big{
  font-family:'Klee One';font-weight:600;
  font-size:clamp(120px,38vw,190px);line-height:1.1;color:var(--ink);
}
.kface.front .hint{margin-top:14px;font-size:12.5px;color:var(--ink-soft);letter-spacing:.1em}
.kface.back{justify-content:center}
.kface.back .big{font-family:'Klee One';font-weight:600;font-size:84px;line-height:1;color:var(--shu)}
.kface.back .roma{font-family:'Gowun Batang';font-size:34px;font-weight:700;margin:6px 0 2px}
.kface.back .pron{font-size:13px;color:var(--ink-soft);margin-bottom:14px}
.kface.back .mnemo{
  background:var(--paper-2);border-radius:14px;padding:14px 16px;
  font-size:14.5px;line-height:1.6;text-align:center;color:var(--ink);
  max-width:300px;
}
.kface.back .mnemo b{color:var(--shu)}
.hear{
  margin-top:16px;display:inline-flex;align-items:center;gap:8px;
  border:1.5px solid var(--shu);color:var(--shu);background:rgba(207,53,36,.06);
  border-radius:999px;padding:9px 18px;font-family:'Gowun Batang';font-weight:700;font-size:14px;cursor:pointer;
}
.hear svg{width:16px;height:16px}
.card-nav{display:flex;gap:10px;padding:18px 0 6px;align-items:center}
.card-nav .btn{width:auto;flex:1;padding:13px 10px;font-size:15px}
.card-pos{font-family:'Gowun Batang';font-size:14px;color:var(--ink-soft);min-width:52px;text-align:center;flex:none}
.learn-actions{padding:10px 0 0}

/* ---------- quiz ---------- */
.quiz-stage{padding:10px 20px 0;display:flex;flex-direction:column;min-height:calc(100dvh - 96px)}
.q-top{display:flex;align-items:center;gap:12px;margin-top:6px}
.q-count{font-family:'Gowun Batang';font-weight:700;font-size:14px;color:var(--ink-soft);flex:none}
.combo{
  flex:none;font-family:'Gowun Batang';font-weight:700;font-size:13px;color:var(--kin);
  background:rgba(185,134,46,.1);border:1px solid rgba(185,134,46,.35);
  border-radius:99px;padding:4px 12px;opacity:0;transform:scale(.8);transition:.2s;
}
.combo.on{opacity:1;transform:scale(1)}
.q-timer{flex:1;height:8px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.q-timer i{display:block;height:100%;background:var(--shu);border-radius:99px;width:100%}
.q-timer i.low{background:#c22}
.q-prompt{
  background:var(--card);border:1px solid var(--line);border-radius:22px;
  box-shadow:var(--shadow);
  margin-top:18px;padding:34px 20px;text-align:center;position:relative;overflow:hidden;
}
.q-prompt .qtype{font-size:11.5px;letter-spacing:.16em;color:var(--ink-soft);text-transform:uppercase}
.q-prompt .qbig{font-family:'Klee One';font-weight:600;font-size:clamp(88px,26vw,130px);line-height:1.15;margin-top:6px}
.q-prompt .qbig.roma{font-family:'Gowun Batang';font-size:clamp(48px,14vw,68px);letter-spacing:.02em}
.q-prompt .qlisten{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:10px}
.q-prompt .qlisten .play-big{
  width:92px;height:92px;border-radius:50%;border:none;cursor:pointer;
  background:var(--ai);color:#fff;display:grid;place-items:center;
  box-shadow:0 5px 0 var(--ai-d);
}
.q-prompt .qlisten .play-big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ai-d)}
.q-prompt .qlisten .play-big svg{width:34px;height:34px}
.q-prompt .qlisten .lbl{font-size:13px;color:var(--ink-soft)}
.q-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.opt{
  background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:20px 10px;text-align:center;cursor:pointer;
  font-family:'Klee One';font-weight:600;font-size:34px;color:var(--ink);
  transition:transform .08s, border-color .15s, background .15s;
  box-shadow:0 3px 0 var(--line);
}
.opt.roma{font-family:'Gowun Batang';font-size:24px;font-weight:700;padding:24px 10px}
.opt:active{transform:scale(.97)}
.opt.correct{background:#e8f2e6;border-color:var(--ok);color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.opt.wrong{background:#f9e9e6;border-color:var(--shu);color:var(--shu);box-shadow:0 3px 0 var(--shu)}
.opt.disabled{pointer-events:none;opacity:.75}
.q-feedback{
  margin-top:14px;text-align:center;font-family:'Gowun Batang';font-weight:700;font-size:15px;
  min-height:24px;
}
.q-feedback.good{color:var(--ok)}
.q-feedback.bad{color:var(--shu)}

/* ---------- writing ---------- */
.write-stage{padding:8px 20px 0;display:flex;flex-direction:column;align-items:center}
.w-guide-info{width:100%;display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px}
.w-guide-info .wi-k{font-family:'Klee One';font-size:22px}
.w-guide-info .wi-r{font-size:13px;color:var(--ink-soft)}
.canvas-wrap{
  position:relative;width:min(100%,360px);aspect-ratio:1;
  background:var(--card);border:1.5px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);overflow:hidden;touch-action:none;
}
.canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
#guideCanvas{pointer-events:none}
#drawCanvas{cursor:crosshair;touch-action:none}
.w-btns{display:flex;gap:10px;width:min(100%,360px);margin-top:14px}
.w-btns .btn{font-size:14.5px;padding:12px 8px}
.w-score{
  margin-top:14px;width:min(100%,360px);background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:16px 18px;display:none;text-align:center;
}
.w-score.show{display:block;animation:fadeUp .3s ease}
.w-score .ws-num{font-family:'Gowun Batang';font-size:40px;font-weight:700}
.w-score .ws-msg{font-size:14px;color:var(--ink-soft);margin-top:2px}
.w-score .ws-bars{margin-top:10px;text-align:left;font-size:12px;color:var(--ink-soft)}
.w-score .ws-bars .bar{margin-top:4px}

/* ---------- result ---------- */
.result-stage{padding:40px 20px 0;display:flex;flex-direction:column;align-items:center;text-align:center}
.pass-stamp{
  width:130px;height:130px;border-radius:26px;
  border:5px solid var(--shu);color:var(--shu);
  display:grid;place-items:center;
  font-family:'Klee One';font-weight:600;font-size:52px;
  transform:rotate(-8deg) scale(0);
  background:rgba(207,53,36,.06);
  box-shadow:0 0 0 6px rgba(207,53,36,.12) inset;
}
.pass-stamp.pop{animation:stampIn .5s cubic-bezier(.2,1.6,.4,1) .2s forwards}
@keyframes stampIn{to{transform:rotate(-8deg) scale(1)}}
.result-stage h2{font-family:'Gowun Batang';font-size:26px;margin-top:22px}
.result-stage .rs-sub{font-size:13.5px;color:var(--ink-soft);margin-top:6px}
.rs-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;margin-top:24px}
.rs-cell{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 8px}
.rs-cell .v{font-family:'Gowun Batang';font-weight:700;font-size:22px}
.rs-cell .v.gold{color:var(--kin)}
.rs-cell .k{font-size:11.5px;color:var(--ink-soft);margin-top:4px}
.result-actions{width:100%;margin-top:26px;display:flex;flex-direction:column;gap:10px}

/* ---------- kana table ---------- */
.table-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 20px;
}
.kcell{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 4px 8px;text-align:center;cursor:pointer;
}
.kcell .kk{font-family:'Klee One';font-weight:600;font-size:24px;line-height:1.2}
.kcell .kr{font-size:10.5px;color:var(--ink-soft)}
.kcell.learned{border-color:rgba(61,122,79,.5);background:rgba(61,122,79,.06)}
.kcell.empty{background:transparent;border-color:transparent;pointer-events:none}

/* ---------- footer note ---------- */
.foot-note{margin:30px 20px 0;text-align:center;font-size:11.5px;color:#a99d82;line-height:1.7}

/* ---------- confetti ---------- */
.confetti{position:fixed;top:-10px;z-index:60;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px);
  transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#f6f0e4;border-radius:12px;padding:11px 20px;
  font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:70;
  max-width:84%;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="vstrip left">ひらがな　から　はじめよう</div>
<div class="vstrip right">かな道場</div>
<div id="app">
  <div style="padding:60px 30px;text-align:center;font-family:sans-serif;color:#5c564a">
    <div style="font-size:42px">か</div>
    <p style="margin-top:14px;line-height:1.7">かな道場을 불러오는 중입니다…<br>
    <small>이 화면이 계속 보이면 <b>Safari</b>로 열어 주세요.</small></p>
  </div>
</div>
<div id="toast"></div>
<noscript>
  <div style="position:fixed;inset:0;background:#f6f0e4;display:grid;place-items:center;padding:30px;text-align:center;font-family:sans-serif">
    이 앱은 JavaScript가 필요합니다. Safari 브라우저로 열어 주세요.
  </div>
</noscript>

<script>
/* ================= DATA ================= */
const HIRA = [
 {k:'あ',r:'a',m:'아줌마가 <b>"아~"</b> 하고 입을 크게 벌린 모양'},
 {k:'い',r:'i',m:'<b>이</b>어폰 두 줄이 나란히 늘어선 모양'},

 {t:'か행', s:[5,10]},
 {t:'さ행', s:[10,15]},
 {t:'た행', s:[15,20]},
 {t:'な행', s:[20,25]},
 {t:'は행', s:[25,30]},

];
const KATA_ROW_NAMES = ['모음 · ア行','カ行','サ行','タ行','ナ行','ハ行','マ行','ヤ行','ラ行','ワ行 · ン'];
function buildLessons(){
  const L=[];
  ROW_CUTS.forEach((row,i)=>{
    L.push({id:'h'+(i+1), script:'hira', title:row.t, chars:HIRA.slice(row.s[0],row.s[1]).map(c=>c.k)});
  });
  ROW_CUTS.forEach((row,i)=>{
    L.push({id:'k'+(i+1), script:'kata', title:KATA_ROW_NAMES[i], chars:KATA.slice(row.s[0],row.s[1]).map(c=>c.k)});
  });
  return L;
}
const LESSONS = buildLessons();
const CHAR_MAP = {};
HIRA.forEach(c=>CHAR_MAP[c.k]={...c,script:'hira'});
KATA.forEach(c=>CHAR_MAP[c.k]={...c,script:'kata'});

/* ================= STATE ================= */
const SKEY='kana-dojo-v1';
let state;
try{ state = JSON.parse(localStorage.getItem(SKEY)) || null; }catch(e){ state=null; }
if(!state) state = {xp:0, streak:0, lastDay:null, done:{}, mastery:{}, tab:'hira'};
function save(){ try{localStorage.setItem(SKEY, JSON.stringify(state));}catch(e){} }

function isDone(id){ return !!state.done[id]; }
function lessonIdx(id){ return LESSONS.findIndex(l=>l.id===id); }
function isUnlocked(i){
  if(i<=0) return true;
  return isDone(LESSONS[i-1].id);
}
function nextLesson(){
  for(let i=0;i<LESSONS.length;i++){
    if(!isDone(LESSONS[i].id) && isUnlocked(i)) return LESSONS[i];
  }
  return null;
}
function learnedChars(uptoLessonId){
  const idx = uptoLessonId? lessonIdx(uptoLessonId) : -1;
  const set=[];
  LESSONS.forEach((l,i)=>{ if(i<idx) set.push(...l.chars); });
  return set;
}

const HIRA_ORDER = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん";
const KATA_ORDER = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン";
const player = new Audio();
player.preload = 'auto';
player.setAttribute('playsinline','');
try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
let audioUnlocked=false;
function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked=true;
  try{
    player.src='data:audio/mpeg;base64,'+KANA_AUDIO['あ'];
    player.muted=true;
    const p=player.play();
    if(p && p.then) p.then(()=>{player.pause();player.muted=false;}).catch(()=>{player.muted=false;audioUnlocked=false;});
    else player.muted=false;
  }catch(e){ player.muted=false; audioUnlocked=false; }
}
document.addEventListener('touchend', unlockAudio, {passive:true});
document.addEventListener('click', unlockAudio);
function speak(ch){
  let key = ch;
  const ki = KATA_ORDER.indexOf(ch);
  if(ki>=0) key = HIRA_ORDER[ki];
  const b64 = KANA_AUDIO[key];
  if(!b64) return;
  audioUnlocked=true;
  try{
    player.pause();
    player.muted=false;
    player.src='data:audio/mpeg;base64,'+b64;
    player.currentTime=0;
    const p=player.play();
    if(p && p.catch) p.catch(()=>toast('화면을 한 번 누른 뒤 다시 들어 보세요'));
  }catch(e){}
}

/* ================= HELPERS ================= */
const $ = s=>document.querySelector(s);
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2200);
}
function shuffle(a){ const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }
function fmtTime(ms){ const s=Math.round(ms/1000); return Math.floor(s/60)+'분 '+(s%60)+'초'; }
const SVG_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>';

function confetti(n=44){
  const colors=['#cf3524','#b9862e','#33507d','#3d7a4f','#e7c86e'];
  for(let i=0;i<n;i++){
    const c=document.createElement('div');
    c.className='confetti';
    const sz=6+Math.random()*7;
    c.style.cssText=`left:${Math.random()*100}vw;width:${sz}px;height:${sz*(0.6+Math.random())}px;background:${colors[i%colors.length]};animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*0.5}s;transform:rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3800);
  }
}
function markStudy(){
  const today = new Date().toDateString();
  if(state.lastDay !== today){
    const y = new Date(Date.now()-864e5).toDateString();
    state.streak = (state.lastDay===y) ? state.streak+1 : 1;
    state.lastDay = today;
  }
}

/* ---------- PHASE 2 : quiz ---------- */
const Q_N = 10, Q_TIME = 7000;
let quiz=null, qTimer=null;

function startQuiz(){
  const L=session.lesson;
  const prior = learnedChars(L.id).filter(k=>CHAR_MAP[k].script===L.script);
  const sameScript = (L.script==='hira'?HIRA:KATA).map(c=>c.k);
  const qs=[];
  const types=['k2r','r2k','listen'];
  for(let n=0;n<Q_N;n++){
    const fromLesson = Math.random()<0.65 || prior.length<4;
    const ansPool = fromLesson? L.chars : [...L.chars, ...prior];
    const ans = ansPool[Math.floor(Math.random()*ansPool.length)];
    const type = types[n%3];
    const distract = shuffle(sameScript.filter(k=>k!==ans)).slice(0,3);
    const options = shuffle([ans, ...distract]);
    qs.push({type, ans, options});
  }
  quiz={qs, i:0, right:0, combo:0, maxCombo:0};
  renderQuestion();
}
function renderQuestion(){
  const L=session.lesson;
  const q=quiz.qs[quiz.i];
  const ansChar=CHAR_MAP[q.ans];
  let promptHtml='', optClass='';
  if(q.type==='k2r'){
    promptHtml=`<div class="qtype">이 글자의 발음은?</div><div class="qbig">${ansChar.k}</div>`;
    optClass='roma';
  }else if(q.type==='r2k'){
    promptHtml=`<div class="qtype">[ ${ansChar.r} ] 발음의 글자는?</div><div class="qbig roma">${ansChar.r}</div>`;
  }else{
    promptHtml=`<div class="qtype">소리를 듣고 글자를 고르세요</div>
      <div class="qlisten">
        <button class="play-big" id="replayBtn">${SVG_SPK}</button>
        <div class="lbl">다시 들으려면 눌러 주세요</div>
      </div>`;
  }
  show(`
  <div class="screen active">
    ${subTop(L,2)}
    <div class="quiz-stage">
      <div class="q-top">
        <div class="q-count">${quiz.i+1} / ${Q_N}</div>
        <div class="combo ${quiz.combo>=2?'on':''}" id="comboChip">COMBO ×${quiz.combo}</div>
        <div class="q-timer"><i id="timerBar"></i></div>
      </div>
      <div class="q-prompt">${promptHtml}</div>
      <div class="q-options">
        ${q.options.map(o=>`<div class="opt ${optClass}" data-k="${o}">${q.type==='k2r'?CHAR_MAP[o].r:o}</div>`).join('')}
      </div>
      <div class="q-feedback" id="qfb"></div>
    </div>
  </div>`);
  bindBack();
  if(q.type==='listen'){
    setTimeout(()=>speak(q.ans), 350);
    const rp=$('#replayBtn'); if(rp) rp.onclick=()=>speak(q.ans);
  }
  // timer
  const bar=$('#timerBar');
  const t0=performance.now();
  clearInterval(qTimer);
  qTimer=setInterval(()=>{
    const p=1-(performance.now()-t0)/Q_TIME;
    if(p<=0){
      clearInterval(qTimer);
      answer(null, q);
      return;
    }
    bar.style.width=(p*100)+'%';
    if(p<0.3) bar.classList.add('low');
  },50);
  document.querySelectorAll('.opt').forEach(o=>{
    o.onclick=()=>{ clearInterval(qTimer); answer(o.dataset.k, q); };
  });
}
function answer(picked, q){
  document.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('disabled');
    if(o.dataset.k===q.ans) o.classList.add('correct');
    else if(o.dataset.k===picked) o.classList.add('wrong');
  });
  const fb=$('#qfb');
  if(picked===q.ans){
    quiz.right++; quiz.combo++; quiz.maxCombo=Math.max(quiz.maxCombo,quiz.combo);
    const gain=10+(quiz.combo-1)*2+(q.type==='listen'?2:0);
    session.xpEarned+=gain;
    fb.textContent = quiz.combo>=2 ? `정답! 콤보 ×${quiz.combo} (+${gain} XP)` : `정답! (+${gain} XP)`;
    fb.className='q-feedback good';
    // mastery
    const m=state.mastery[q.ans]||{c:0,n:0}; m.c++; m.n++; state.mastery[q.ans]=m;
  }else{
    quiz.combo=0;
    fb.textContent = picked===null
      ? `시간 초과! 정답은 ${q.ans} [ ${CHAR_MAP[q.ans].r} ]`
      : `오답! 정답은 ${q.ans} [ ${CHAR_MAP[q.ans].r} ]`;
    fb.className='q-feedback bad';
    const m=state.mastery[q.ans]||{c:0,n:0}; m.n++; state.mastery[q.ans]=m;
  }
  quiz.i++;
  setTimeout(()=>{
    if(quiz.i<Q_N) renderQuestion();
    else finishQuiz();
  }, 1100);
}
function finishQuiz(){
  session.quizStat={right:quiz.right,total:Q_N,maxCombo:quiz.maxCombo};
  startWriting(0);
}

function setupCanvases(ch){
  const wrap=$('#cwrap');
  const dpr=window.devicePixelRatio||1;
  const size=wrap.clientWidth;
  ['guideCanvas','drawCanvas'].forEach(id=>{
    const cv=$('#'+id);
    cv.width=size*dpr; cv.height=size*dpr;
    cv.getContext('2d').scale(dpr,dpr);
  });
  redrawAll(ch);
  const cv=$('#drawCanvas');
  wCtx=cv.getContext('2d');
  strokes=0; hasInk=false;
  const pos=e=>{
    const r=cv.getBoundingClientRect();
    return [e.clientX-r.left, e.clientY-r.top];
  };
  cv.onpointerdown=e=>{
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    drawing=true; strokes++;
    const [x,y]=pos(e);
    wCtx.beginPath(); wCtx.moveTo(x,y);
  };
  cv.onpointermove=e=>{
    if(!drawing) return;
    const [x,y]=pos(e);
    wCtx.lineTo(x,y);
    wCtx.strokeStyle='#cf3524';
    wCtx.lineWidth=Math.max(10, cv.clientWidth*0.045);
    wCtx.lineCap='round'; wCtx.lineJoin='round';
    wCtx.stroke();
    hasInk=true;
  };
  cv.onpointerup=cv.onpointercancel=()=>{ drawing=false; };
}
function redrawAll(ch){
  const wrap=$('#cwrap');
  const size=wrap.clientWidth;
  // guide layer
  const g=$('#guideCanvas').getContext('2d');
  g.clearRect(0,0,size,size);
  g.strokeStyle='#e2d7c0'; g.lineWidth=1.5; g.setLineDash([7,7]);
  g.beginPath(); g.moveTo(size/2,10); g.lineTo(size/2,size-10); g.stroke();
  g.beginPath(); g.moveTo(10,size/2); g.lineTo(size-10,size/2); g.stroke();
  g.setLineDash([]);
  g.strokeStyle='#ddd0b6'; g.lineWidth=2; g.setLineDash([3,6]);
  g.strokeRect(14,14,size-28,size-28);
  g.setLineDash([]);
  g.fillStyle='rgba(38,35,30,0.13)';
  g.font=`600 ${size*0.62}px 'Klee One', serif`;
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText(ch, size/2, size/2 + size*0.03);
  // clear draw layer
  const d=$('#drawCanvas').getContext('2d');
  d.clearRect(0,0,size,size);
  hasInk=false;
}
/* scoring: compare user ink against guide glyph mask */
function grade(){
  const wrap=$('#cwrap');
  const size=wrap.clientWidth;
  const S=Math.round(size);
  const ch=session.lesson.chars[session.writeScores.length];
  // guide mask
  const gm=document.createElement('canvas'); gm.width=S; gm.height=S;
  const g=gm.getContext('2d');
  g.fillStyle='#000';
  g.font=`600 ${S*0.62}px 'Klee One', serif`;
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText(ch, S/2, S/2+S*0.03);
  const gd=g.getImageData(0,0,S,S).data;
  // user mask
  const uv=$('#drawCanvas');
  const um=document.createElement('canvas'); um.width=S; um.height=S;
  const u=um.getContext('2d');
  u.drawImage(uv,0,0,S,S);
  const ud=u.getImageData(0,0,S,S).data;
  // build guide set & dilated guide set
  const tol=Math.max(8, S*0.05);
  const cell=4; // sample every 4px for speed
  const grid=Math.ceil(S/cell);
  const gMask=new Uint8Array(grid*grid);
  let gCount=0, uCount=0, uIn=0, gCov=0;
  for(let gy=0;gy<grid;gy++)for(let gx=0;gx<grid;gx++){
    const px=Math.min(S-1,gx*cell), py=Math.min(S-1,gy*cell);
    const idx=(py*S+px)*4;
    if(gd[idx+3]>60){ gMask[gy*grid+gx]=1; gCount++; }
  }
  const uMask=new Uint8Array(grid*grid);
  for(let gy=0;gy<grid;gy++)for(let gx=0;gx<grid;gx++){
    const px=Math.min(S-1,gx*cell), py=Math.min(S-1,gy*cell);
    const idx=(py*S+px)*4;
    if(ud[idx+3]>60){ uMask[gy*grid+gx]=1; uCount++; }
  }
  if(uCount===0) return {score:0,precision:0,coverage:0};
  const R=Math.max(1,Math.round(tol/cell));
  const near=(mask,gx,gy)=>{
    for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
      if(dx*dx+dy*dy>R*R) continue;
      const x=gx+dx,y=gy+dy;
      if(x<0||y<0||x>=grid||y>=grid) continue;
      if(mask[y*grid+x]) return true;
    }
    return false;
  };
  for(let gy=0;gy<grid;gy++)for(let gx=0;gx<grid;gx++){
    if(uMask[gy*grid+gx] && near(gMask,gx,gy)) uIn++;
    if(gMask[gy*grid+gx] && near(uMask,gx,gy)) gCov++;
  }
  const precision=Math.round(uIn/uCount*100);
  const coverage=Math.round(gCov/gCount*100);
  let score=Math.round(precision*0.45 + coverage*0.55);
  if(strokes>10) score=Math.max(0, score-(strokes-10)*2); // 너무 많은 획 감점
  score=Math.max(5,Math.min(100,score));
  return {score, precision, coverage};
}

  requestAnimationFrame(()=>{
    const ps=$('#pstamp'); if(ps) ps.classList.add('pop');
    if(acc>=70) confetti(acc>=100?70:40);
  });
  const nb=$('#nextLessonBtn'); if(nb) nb.onclick=()=>startLesson(nl.id);
  $('#homeBtn').onclick=()=>renderHome();
}


/* ================= PWA ================= */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
/* ================= BOOT ================= */
function boot(){
  try{ renderHome(); }
  catch(e){
    app.innerHTML='<div style="padding:60px 30px;text-align:center;color:#5c564a;font-family:sans-serif">'
      +'화면을 그리는 중 문제가 생겼어요.<br><small style="word-break:break-all">'+String(e)+'</small></div>';
  }
}
window.addEventListener('resize',()=>{
  const cv=$('#drawCanvas');
  if(cv && session && !session.review){ /* keep simple: no live re-init */ }
});
try{
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(()=>{ boot(); }).catch(()=>boot());
  }
}catch(e){}
boot();
</script>

</script>
</body>
</html>
